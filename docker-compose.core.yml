services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: quickbite_core
      POSTGRES_USER: quickbite
      POSTGRES_PASSWORD: quickbite_test_only
    ports:
      - "${QUICKBITE_POSTGRES_PORT:-54329}:5432"
    volumes:
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quickbite -d quickbite_core"]
      interval: 5s
      timeout: 5s
      retries: 10
