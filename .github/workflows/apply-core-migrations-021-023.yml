name: Apply Core migrations 021-023

on:
  push:
    branches:
      - ops/apply-core-migrations-021-023
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    name: Apply QuickBite Core schema migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
      PGSSLMODE: require
    steps:
      - name: Checkout exact migration branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=true

      - name: Apply migrations 021, 022 and 023
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DATABASE_URL" || {
            echo "::error::GitHub Actions secret SUPABASE_DB_URL is missing."
            exit 1
          }

          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import path from 'node:path';
          import pg from 'pg';

          const migrations = [
            'database/migrations/021_academic_hierarchy.sql',
            'database/migrations/022_recess_schedules_core.sql',
            'database/migrations/023_academic_admin_controls.sql',
          ];

          const client = new pg.Client({
            connectionString: process.env.DATABASE_URL,
            ssl: { rejectUnauthorized: false },
          });

          await client.connect();
          try {
            const preflight = await client.query(`
              SELECT
                to_regclass('quickbite.users') AS users_table,
                to_regclass('quickbite.user_identity') AS identity_table
            `);

            const row = preflight.rows[0];
            if (!row.users_table || !row.identity_table) {
              throw new Error(
                'La base destino no parece ser QuickBite Core: faltan quickbite.users o quickbite.user_identity.'
              );
            }

            for (const file of migrations) {
              const sql = await fs.readFile(path.resolve(file), 'utf8');
              console.log(`Aplicando ${file}`);
              await client.query('BEGIN');
              try {
                await client.query(sql);
                await client.query('COMMIT');
              } catch (error) {
                await client.query('ROLLBACK');
                throw error;
              }
            }

            const verify = await client.query(`
              SELECT
                to_regclass('quickbite.academic_sections') AS academic_sections,
                to_regclass('quickbite.academic_grades') AS academic_grades,
                to_regclass('quickbite.academic_courses') AS academic_courses,
                to_regclass('quickbite.student_enrollments') AS student_enrollments,
                to_regclass('quickbite.recess_schedules') AS recess_schedules,
                to_regclass('quickbite.recess_schedule_targets') AS recess_schedule_targets
            `);

            const v = verify.rows[0];
            for (const [key, value] of Object.entries(v)) {
              if (!value) throw new Error(`Falta objeto requerido después de migrar: ${key}`);
            }

            const activeColumns = await client.query(`
              SELECT column_name
              FROM information_schema.columns
              WHERE table_schema = 'quickbite'
                AND table_name IN ('academic_sections','academic_grades','academic_courses')
                AND column_name = 'active'
              ORDER BY table_name
            `);

            if (activeColumns.rowCount !== 3) {
              throw new Error('No quedaron creadas las tres columnas active de la migración 023.');
            }

            console.log('VERIFICACION_OK');
            console.log(JSON.stringify({
              objects: v,
              active_columns: activeColumns.rows.map((r) => r.column_name),
            }));
          } finally {
            await client.end();
          }
          NODE
